<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart: Gestión de Carreras</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilo global */
        body {
            background: url('https://imgs.search.brave.com/aRWfQTLWLFFlQVx6s1_wSbkx1ZOqx-UQueJRNPkepvw/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tZWRp/YS50ZW5vci5jb20v/RjZ5c0tFaDFWSVFB/QUFBTS90aGUtc3Vw/ZXItbWFyaW8tYnJv/cy1tb3ZpZS10cmFp/bGVyLmdpZg.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Russo One', sans-serif;
            color: #fff;
        }

        /* Cabecera y título */
        h1 {
            font-size: 36px;
            font-weight: bold;
            color: #ff5733;
            text-align: center;
            text-transform: uppercase;
            padding-top: 20px;
        }

        /* Efecto de sombra a las tarjetas */
        .card {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            border: 2px solid #ffcc00;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        /* Títulos de las tarjetas */
        .card-title {
            font-size: 22px;
            color: #ffcc00;
            text-align: center;
            text-transform: uppercase;
        }

        /* Botones con efectos */
        .btn-primary {
            background-color: #ff5733;
            border: none;
            font-size: 18px;
            padding: 12px;
            width: 100%;
            transition: transform 0.3s, background-color 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.1);
            background-color: #c70039;
        }

        .btn-secondary, .btn-success, .btn-danger {
            background-color: #3498db;
            border: none;
            font-size: 18px;
            width: 100%;
            padding: 12px;
        }

        .btn-secondary:hover, .btn-success:hover, .btn-danger:hover {
            background-color: #2980b9;
        }

        /* Campos de entrada */
        input, select, textarea {
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid #ff5733;
            border-radius: 5px;
            padding: 10px;
            font-size: 16px;
        }

        /* Estilo de las alertas */
        .alert {
            background-color: rgba(255, 255, 255, 0.7);
            color: #2c3e50;
            font-weight: bold;
            font-size: 20px;
        }

        /* Personalización de fuentes */
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');
        
        /* Fuentes */
        label, button, input, select {
            font-family: 'Russo One', sans-serif;
            font-size: 16px;
        }

        /* Elementos del formulario */
        .form-label {
            font-size: 16px;
            color: #ffcc00;
            text-transform: uppercase;
        }

        .d-flex .border {
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Layout de los formularios */
        .row {
            margin-top: 30px;
        }
    </style>
    <script type="module" src="app.js"></script>
</head>
<body>

    <h1>Gestión de Carreras Mario Kart</h1>

    <!-- Gestión de Participantes -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Gestión de Participantes</h5>
                    <div class="mb-3">
                        <label for="participant-name" class="form-label">Nombre:</label>
                        <input class="form-control" id="participant-name" list="participant-list">
                        <datalist id="participant-list"></datalist>
                    </div>
                    <div class="mb-3">
                        <label for="participant-vehicle" class="form-label">Vehículo:</label>
                        <select id="participant-vehicle" class="form-select">
                            <option selected>Selecciona un vehículo</option>
                        </select>
                    </div>
                    <button class="btn btn-primary">Guardar Participante</button>
                    <button class="btn btn-secondary mt-2">Cargar Estadísticas</button>
                </div>
            </div>
        </div>
        <!-- Nuevo Vehículo -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Nuevo Vehículo</h5>
                    <div class="mb-3">
                        <label for="vehicle-model" class="form-label">Modelo:</label>
                        <input class="form-control" id="vehicle-model" list="model-list">
                        <datalist id="model-list"></datalist>
                    </div>
                    <div class="mb-3">
                        <label for="min-speed" class="form-label">Min Vel:</label>
                        <input type="number" id="min-speed" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="max-speed" class="form-label">Max Vel:</label>
                        <input type="number" id="max-speed" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="vehicle-traction" class="form-label">Tracción:</label>
                        <select id="vehicle-traction" class="form-select">
                            <option value="dura">Dura</option>
                            <option value="mediana">Mediana</option>
                            <option value="blanda">Blanda</option>
                        </select>
                    </div>
                    <button class="btn btn-primary">Nuevo Vehículo</button>
                    <button class="btn btn-secondary mt-2">Cargar Estadísticas</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Nuevo Circuito -->
    <div class="row mb-4">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Nuevo Circuito</h5>
                    <div class="row">
                        <div class="col-md-4">
                            <label for="circuit-name" class="form-label">Nombre:</label>
                            <input type="text" id="circuit-name" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="circuit-length" class="form-label">Longitud:</label>
                            <input type="text" id="circuit-length" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="circuit-time" class="form-label">Tiempo:</label>
                            <input type="text" id="circuit-time" class="form-control">
                        </div>
                    </div>
                    <button class="btn btn-primary mt-3">Nueva Carrera</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Asignar y Quitar Participantes -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Asigna un participante al circuito</h5>
                    <div class="row">
                        <div class="col-md-6">
                            <label for="circuit-select" class="form-label">Circuito:</label>
                            <select id="circuit-select" class="form-select">
                                <option selected>Selecciona un circuito</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="participant-select" class="form-label">Participantes:</label>
                            <select id="participant-select" class="form-select">
                                <option selected>Selecciona un participante</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-success mt-3">Asignar</button>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Quita un participante del circuito</h5>
                    <div class="row">
                        <div class="col-md-6">
                            <label for="circuit-remove" class="form-label">Circuito:</label>
                            <select id="circuit-remove" class="form-select">
                                <option selected>Selecciona un circuito</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="participant-remove" class="form-label">Participantes:</label>
                            <select id="participant-remove" class="form-select">
                                <option selected>Selecciona un participante</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-danger mt-3">Quitar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Carga Circuito -->
    <div class="row mb-4">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Carga Circuito</h5>
                    <div class="alert alert-info text-center" role="alert">
                        Circuito Cargado: <strong>La gran carrera</strong>, Lluvioso, 150px
                    </div>
                    <div class="d-flex justify-content-between">
                        <div class="border p-3">Super Mario</div>
                        <button class="btn btn-primary">START!</button>
                        <div class="border p-3">FINISH!!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Comentarios -->
    <div class="row">
        <div class="col">
            <textarea class="form-control" rows="3" placeholder="Comentarios"></textarea>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
